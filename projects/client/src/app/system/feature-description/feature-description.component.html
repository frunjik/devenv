<main class="feature-description">
    <h1>New feature</h1>
    <form (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
            <mat-label>Feature description</mat-label>
            <textarea
                matInput
                name="description"
                [(ngModel)]="description"
                rows="8"
                aria-label="Feature description"
                placeholder="Describe the feature to write"
                (keydown)="onDescriptionKeydown($event)"
            ></textarea>
        </mat-form-field>
        <button type="submit" mat-raised-button color="primary" [disabled]="!description.trim() || isSubmitting">
            {{ isSubmitting ? 'Adding…' : 'Add feature' }}
        </button>
    </form>
    <p *ngIf="successMessage" role="status">{{ successMessage }}</p>
    <p *ngIf="errorMessage" id="feature-submit-error" role="alert">{{ errorMessage }}</p>
    <section class="open-features" aria-labelledby="open-features-heading">
        <h2 id="open-features-heading">Open features</h2>
        <p *ngIf="isLoadingFeatures" role="status">Loading features…</p>
        <p *ngIf="featuresError" id="feature-list-error" role="alert">{{ featuresError }}</p>
        <p *ngIf="!isLoadingFeatures && !featuresError && features.length === 0">No open features.</p>
        <table mat-table [dataSource]="featureDataSource" *ngIf="features.length > 0">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let feature" [attr.title]="feature.id">{{ feature.id | slice:0:8 }}</td>
            </ng-container>
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Description</th>
                <td mat-cell *matCellDef="let feature">{{ feature.description }}</td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef>
                    <button type="button" mat-button>Start</button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator
            [hidden]="features.length === 0"
            [pageSize]="5"
            [pageSizeOptions]="[5, 10, 25]"
            showFirstLastButtons
            aria-label="Open feature pages"
        ></mat-paginator>
    </section>
</main>
