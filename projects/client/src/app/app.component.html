<mat-toolbar color="primary">
    PPT - {{host}}
    |
    <nav>
        <a routerLink="/">Main</a>
        |
        <a routerLink="/ppt/browse">Browse</a>
        |
        <a routerLink="/tests">TEST</a>
        |
        <a routerLink="/ppt/browse" [queryParams]="{path: './projects/server/src/lib', file: ''}">Server</a>
        |
        <a routerLink="/ppt/browse" [queryParams]="{path: './projects/client/src/app', file: ''}">Client</a>
        |
        <a routerLink="/ppt/browse" [queryParams]="{path: '', file: 'TODO.md'}">TODO</a>
        |
        <a routerLink="/ppt/browse" [queryParams]="{file: '/scratch.txt'}">SCRATCH</a>
        |
        <a routerLink="/ppt/browse" [queryParams]="{path: '/projects/client/src/app', file: '/projects/client/src/app/app.component.html'}">EDIT-MENU</a>

        <button type="button" mat-button (click)="commitChanges()" [disabled]="isCommitting">
            {{ isCommitting ? 'Committing…' : 'Commit changes' }}
        </button>

        <!--
        
        <a routerLink="/ppt/browse" [queryParams]="{path: '/projects/client/src/app/', file: '/projects/client/src/app/app.component.html'}">EDIT-MAIN</a>
        
        -->
    </nav>


</mat-toolbar>

<p role="status" aria-live="polite" *ngIf="commitStatus">{{commitStatus}}</p>
<p role="alert" *ngIf="commitError">{{commitError}}</p>

<router-outlet />
