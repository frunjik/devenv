<mat-toolbar color="primary">
    PPT - {{host}}
    |

    <nav>
        <a mat-button routerLink="/">Main</a>
        |
        <a mat-button routerLink="/ppt/browse">Browse</a>
        |
        <a mat-button routerLink="/tests">TEST</a>
        |
        <a mat-button routerLink="/ppt/browse" [queryParams]="{path: './projects/server/src/lib', file: ''}">Server</a>
        |
        <a mat-button routerLink="/ppt/browse" [queryParams]="{path: './projects/client/src/app', file: ''}">Client</a>
        |
        <a mat-button routerLink="/ppt/browse" [queryParams]="{path: '', file: 'TODO.md'}">TODO</a>
        |
        <a mat-button routerLink="/ppt/browse" [queryParams]="{file: '/scratch.txt'}">SCRATCH</a>
        |
        <a mat-button routerLink="/ppt/browse" [queryParams]="{path: '/projects/client/src/app', file: '/projects/client/src/app/app.component.html'}">EDIT-MENU</a>
        |
        <a mat-button routerLink="/git/log">Git log</a>
        |
        <button type="button" mat-button class="commit-button" (click)="commitChanges()" [disabled]="isCommitting">
            {{ isCommitting ? 'Committing…' : 'Commit changes' }}
        </button>
        |
        <a
            mat-button
            routerLink="/git/log"
            class="git-status-indicator"
            [ngClass]="{
                'git-status-clean': gitStatus.status && gitStatus.status.files.length === 0,
                'git-status-open': gitStatus.status && gitStatus.status.files.length > 0,
                'git-status-error': gitStatus.hasError
            }"
            [attr.aria-label]="'Git status: ' + gitStatus.label"
            [matTooltip]="gitStatus.tooltip"
            matTooltipClass="git-status-tooltip"
            matTooltipPosition="below"
            [matTooltipShowDelay]="250"
            aria-live="polite"
        >{{ gitStatus.count }}</a>

        <!--
        
        <a routerLink="/ppt/browse" [queryParams]="{path: '/projects/client/src/app/', file: '/projects/client/src/app/app.component.html'}">EDIT-MAIN</a>
        
        -->
    </nav>


</mat-toolbar>

<router-outlet />
