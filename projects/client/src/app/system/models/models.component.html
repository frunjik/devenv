<main class="models-page">
    <h1>PPT models</h1>
    <section aria-label="PPT field editor">
        <header class="field-editor-heading">
            <div>
                <h2>Edit a PPT field</h2>
                <p>Choose a field to update its definition in this session.</p>
            </div>
            <label class="field-picker">
                <span>Selected field</span>
                <select
                    aria-label="Select a PPT field"
                    [value]="selectedFieldKey"
                    (change)="selectField(fieldSelection.value)"
                    #fieldSelection
                >
                    @for (option of fieldOptions; track option.key) {
                        <option [value]="option.key">{{ option.label }}</option>
                    }
                </select>
            </label>
        </header>
        @if (selectedField) {
            <ppt-field-editor
                [field]="selectedField"
                (fieldSaved)="saveField($event)"
                (cancelRequested)="cancelField()"
            />
        }
    </section>
    <pre aria-label="PPT model definitions">{{ modelText }}</pre>
</main>
