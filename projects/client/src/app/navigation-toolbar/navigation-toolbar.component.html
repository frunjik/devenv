<mat-toolbar color="primary" class="meta-toolbar">
    <span class="toolbar-title">
        <span class="meta-badge">DevEnv</span>
        <span class="toolbar-brand">{{ host }}</span>
    </span>

    <nav>
        <a mat-button routerLink="/system-plan">System plan</a>
        <a mat-button routerLink="/workflow-todo">Workflow TODO</a>
        <a mat-button routerLink="/workflow-evaluations">Evaluations</a>
        <a mat-button routerLink="/terms">Terms</a>
        <a mat-button routerLink="/glossary">Glossary</a>
        <a mat-button routerLink="/diagram">Diagram</a>
        <a mat-button routerLink="/interactive-canvas">Canvas</a>
        <button
            type="button"
            mat-button
            class="tools-navigation-button"
            [matMenuTriggerFor]="toolsMenu"
        >
            Tools
        </button>
    </nav>
    <mat-menu #toolsMenu="matMenu" xPosition="before">
        <a mat-menu-item routerLink="/browse">Browse</a>
        <a mat-menu-item routerLink="/tests">Tests</a>
        <a mat-menu-item routerLink="/visual-foundations">Visual foundations</a>
        <a mat-menu-item routerLink="/browse" [queryParams]="{path: './projects/server/src/lib', file: ''}">Edit Server</a>
        <a mat-menu-item routerLink="/browse" [queryParams]="{path: './projects/client/src/app', file: ''}">Edit Client</a>
        <a mat-menu-item routerLink="/browse" [queryParams]="{path: '', file: 'TODO.md'}">TODO</a>
        <a mat-menu-item routerLink="/browse" [queryParams]="{path: '/projects/client/src/app', file: '/projects/client/src/app/navigation-toolbar/navigation-toolbar.component.html'}">Edit menu</a>
        <a mat-menu-item routerLink="/git/log">Git log</a>
        <button type="button" mat-menu-item class="clone-button" (click)="cloneRequested.emit()">
            Clone DevEnv
        </button>
        <button
            type="button"
            mat-menu-item
            class="commit-button"
            (click)="commitRequested.emit()"
            [disabled]="isCommitting"
        >
            {{ isCommitting ? 'Committing…' : 'Commit changes' }}
        </button>
    </mat-menu>
</mat-toolbar>
