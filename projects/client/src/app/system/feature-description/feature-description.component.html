<main class="feature-description">
    <h1>New feature</h1>
    <mat-form-field appearance="outline">
        <mat-label>Feature description</mat-label>
        <textarea
            matInput
            [(ngModel)]="description"
            rows="8"
            aria-label="Feature description"
            placeholder="Describe the feature to write"
        ></textarea>
    </mat-form-field>
    <button type="button" mat-raised-button color="primary" [disabled]="!description.trim() || isSubmitting"
        (click)="submit()">
        {{ isSubmitting ? 'Adding…' : 'Add feature' }}
    </button>
    <p *ngIf="successMessage" role="status">{{ successMessage }}</p>
    <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
</main>
