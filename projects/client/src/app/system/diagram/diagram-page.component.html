<section class="diagram-page">
    <h1>Diagram</h1>
    <div
        class="palette"
        id="palette"
        role="toolbar"
        aria-label="Diagram element palette"
        cdkDropList
        cdkDropListConnectedTo="workspace"
        cdkDropListSortingDisabled
    >
        <div class="palette-item">
            <button type="button" aria-label="Add Rectangle" (click)="addElement('rectangle')">Rectangle</button>
            <span
                class="drag-handle"
                cdkDrag
                [cdkDragData]="'rectangle'"
                aria-hidden="true"
                title="Drag Rectangle into the workspace"
            >&#x283F;</span>
        </div>
        <div class="palette-item">
            <button type="button" aria-label="Add Ellipse" (click)="addElement('ellipse')">Ellipse</button>
            <span
                class="drag-handle"
                cdkDrag
                [cdkDragData]="'ellipse'"
                aria-hidden="true"
                title="Drag Ellipse into the workspace"
            >&#x283F;</span>
        </div>
        <div class="palette-item">
            <button type="button" aria-label="Add Note" (click)="addElement('note')">Note</button>
            <span
                class="drag-handle"
                cdkDrag
                [cdkDragData]="'note'"
                aria-hidden="true"
                title="Drag Note into the workspace"
            >&#x283F;</span>
        </div>
    </div>
    @if (document.elements.length === 0) {
        <p class="empty-hint" role="status">No items yet.</p>
    }
    <div
        class="workspace"
        id="workspace"
        role="region"
        tabindex="0"
        aria-label="Diagram workspace"
        cdkDropList
        cdkDropListConnectedTo="palette"
        (cdkDropListDropped)="dropWorkspaceItem($event)"
    >
        @for (element of document.elements; track element.id) {
            <div
                class="diagram-element"
                [attr.data-kind]="element.kind"
                [attr.data-element-id]="element.id"
                [attr.aria-label]="element.kind + ' ' + element.id"
                [attr.aria-pressed]="selectedElementId === element.id"
                [style.left.px]="element.position.x"
                [style.top.px]="element.position.y"
                cdkDrag
                [cdkDragData]="element.id"
                (mousedown)="startWorkspaceElementDrag($event)"
                (touchstart)="startWorkspaceElementDrag($event)"
                role="button"
                tabindex="0"
                (click)="selectElement(element.id)"
                (keydown.enter)="selectElement(element.id)"
                (keydown.space)="$event.preventDefault(); selectElement(element.id)"
            >
                <span>{{ element.label || element.kind }}</span>
                @if (element.kind === 'note') {
                    <p>{{ element.text }}</p>
                }
            </div>
        }
    </div>
</section>
